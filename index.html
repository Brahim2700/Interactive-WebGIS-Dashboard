<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive WebGIS Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#" aria-label="Atlas WebGIS home">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-name">ATLAS</span>
            <span class="brand-divider" aria-hidden="true"></span>
            <span class="brand-section">WEBGIS</span>
        </a>
        <div class="view-label">
            <span class="status-dot" aria-hidden="true"></span>
            <span>WORLD VIEW</span>
        </div>
        <button class="locate-button" id="locate-button" type="button" title="Locate me">
            <span class="locate-icon" aria-hidden="true">&#8982;</span>
            <span>Locate me</span>
        </button>
    </header>

    <main class="map-shell">
        <div id="map" role="application" aria-label="Interactive map of the world"></div>
        <section class="map-readout" aria-label="Location details" aria-live="polite">
            <div class="readout-heading">
                <span class="readout-label">YOUR POSITION</span>
                <span id="location-status">Use Locate me</span>
            </div>
            <div class="readout-row">
                <span class="readout-label">WGS84</span>
                <span id="coordinates">--</span>
            </div>
            <div class="readout-row">
                <span class="readout-label">LAMBERT-93</span>
                <span id="cartesian-coordinates">X -- · Y --</span>
            </div>
            <div class="readout-row epci-row">
                <span class="readout-label">EPCI</span>
                <span id="epci-details">Not determined</span>
            </div>
            <div class="readout-footer">
                <span>Coordinates shared with <a href="https://geo.api.gouv.fr/" target="_blank" rel="noopener noreferrer">geo.api.gouv.fr</a> for EPCI lookup</span>
                <span>ZOOM <span id="zoom-level">--</span></span>
            </div>
        </section>
        <div id="map-message" class="map-message" role="status" hidden></div>
    </main>

    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="https://unpkg.com/proj4@2.12.1/dist/proj4.js"></script>
    <script defer src="js/main.js"></script>
</body>
</html>
